name: Ingest India Top 30 Daily 1m Klines

on:
  schedule:
    # Monday to Friday at 11:00 UTC (16:30 IST - 1 hour after market close)
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance pandas

      - name: Run Top 30 Ingestion
        run: |
          python fetch_top30.py

      - name: Commit and Push Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily 1m kline capture for India Top 30" && git push)
